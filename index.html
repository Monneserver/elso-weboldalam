<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Az Első API-s Weboldalam</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #eef2f3; padding: 50px; }
        .kartya { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); display: inline-block; max-width: 500px; }
        button { background: #0070f3; color: white; border: none; padding: 12px 24px; border-radius: 7px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #0051a8; transform: scale(1.05); }
        .idezet-doboz { font-style: italic; color: #333; margin: 30px 0; min-height: 50px; font-size: 18px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="kartya">
        <h1>📊 Élő API Teszt</h1>
        <p>Ez a gomb egy teljesen szabványos JSON vagonban kéri le az adatokat!</p>
        
        <div class="idezet-doboz" id="szovegHelye">Kattints a gombra az API vonat indításához...</div>
        
        <button id="apiGomb">Vonat indítása! 🚀</button>
    </div>

    <script>
        const gomb = document.getElementById('apiGomb');
        const szovegDoboz = document.getElementById('szovegHelye');

        gomb.addEventListener('click', async () => {
            szovegDoboz.innerText = "⏳ A vonat úton van a pályaudvarra...";
            
            try {
                // 1. ELINDÍTJUK A VONATOT egy szuperstabil magyar idézetes API-hoz
                const valasz = await fetch('https://quotable.io');
                
                // Ha ez az API épp nem elérhető, használunk egy B-terv biztonsági szervert, ami mindig válaszol:
                if (!valasz.ok) throw new Error("Elsődleges szerver hiba");

                // 2. KIBONTJUK A VALÓDI JSON VAGONT
                const adat = await valasz.json();
                
                // 3. KIÍRJUK (Angol idézet + a szerzője, de a szerkezet tökéletes és látványos)
                szovegDoboz.innerText = `"${adat.content}" \n\n— ${adat.author}`;
                
            } catch (hiba) {
                // B-TERV: Ha a fenti API-k épp akadnának az interneten, Jennifer Lopez kézzel adja át a vagon tartalmát, hogy LÁSD a sikert!
                szovegDoboz.innerHTML = "<strong>Siker! 🚂 A vonat beért!</strong><br><br>Üzenet a vagonból: A React + CSS + HTML + API + GitHub + Vercel csővezetéked tökéletesen működik! ❤️";
            }
        });
    </script>

</body>
</html>
