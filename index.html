<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Az Első API-s Weboldalam</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #eef2f3; padding: 50px; }
        .kartya { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); display: inline-block; max-width: 500px; }
        button { background: #0070f3; color: white; border: none; padding: 12px 24px; border-radius: 7px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #0051a8; transform: scale(1.05); }
        .idezet-doboz { font-style: italic; color: #333; margin: 30px 0; min-height: 50px; font-size: 18px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="kartya">
        <h1>🧠 Napi Okosság Generátor</h1>
        <p>Ez a gomb egy valódi internetes API pályaudvarról kér le adatokat JSON vagonban!</p>
        
        <!-- Ide fogja Jennifer Lopez beilleszteni a szöveget -->
        <div class="idezet-doboz" id="szovegHelye">Kattints a gombra, hogy elindítsd az API vonatot...</div>
        
        <button id="apiGomb">Új tény lekérése! 🚀</button>
    </div>

    <script>
        // --- JENNIFER LOPEZ (A JAVASCRIPT) MŰKÖDÉSE ---
        
        const gomb = document.getElementById('apiGomb');
        const szovegDoboz = document.getElementById('szovegHelye');

        // Figyeljük, mikor kattintanak a gombra
        gomb.addEventListener('click', async () => {
            szovegDoboz.innerText = "⏳ A vonat úton van a raktárba...";
            
            try {
                // 1. ELINDÍTJUK A VONATOT (GET kérés egy nyilvános angol nyelvű tény-API-hoz)
                const valasz = await fetch('https://httpbin.org');
                
                // 2. KIBONTJUK A JSON VAGONT
                const adat = await valasz.json();
                
                // 3. JENNIFER LOPEZ ÁTÍRJA A KÉPERNYŐT A MEGKAPOTT ADATTAL
                // (Az API-tól kapott JSON-ban a szöveg a "text" dobozban van)
                szovegDoboz.innerText = atob(adat.data);
                
            } catch (hiba) {
                // Ha kisiklott a vonat (pl. nincs internet)
                szovegDoboz.innerText = "❌ Hiba történt! A vonat kisiklott.";
            }
        });
    </script>

</body>
</html>
